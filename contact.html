<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Bella Rahman</title>
  <meta name="description" content="Send Bella Rahman a message for editing, directing, and visual storytelling work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/bellaes-logo-tv-screen-75-favicon.png">
  <link rel="stylesheet" href="css/base.css?v=23">
</head>

<body class="contact-page">
  <!-- ========== HEADER / NAV ========== -->
  <header id="site-header">
    <nav class="nav-container">
      <a href="index.html" class="nav-logo nav-logo--icon" aria-label="Home">
        <img class="nav-logo-icon" src="assets/images/bellaes-logo-star-tv-transparent.png" alt="">
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="archive.html" class="nav-link">Work</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="contact.html" class="nav-link nav-link--active">Contact</a>
      </div>
    </nav>
  </header>

  <main class="contact-main">
    <section class="contact-hero" aria-label="Contact Bella Rahman">
      <div class="contact-hero-inner">
        <div class="contact-heading-block">
          <p class="contact-kicker">Contact</p>
          <h1>
            Ready When You Are<span class="period-crown" aria-label="."></span>
          </h1>
          <div class="contact-page-links" aria-label="Contact links">
            <a class="contact-link contact-link--email" href="mailto:bellaes.films@gmail.com">
              <svg class="contact-icon email-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="m4 7 8 6 8-6"></path>
              </svg>
              <span>bellaes.films@gmail.com</span>
            </a>
            <span class="contact-divider" aria-hidden="true"></span>
            <a class="contact-link instagram-link" href="https://www.instagram.com/bellaes.still/" target="_blank"
              rel="noopener" aria-label="BellaES Instagram">
              <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1.2"></circle>
              </svg>
              <span>bellaes.still</span>
            </a>
          </div>
        </div>

        <div class="contact-form-panel">
          <form class="contact-form" action="https://formsubmit.co/bellaes.films@gmail.com" method="post">
            <h2>Send Message</h2>
            <input type="hidden" name="_subject" value="New website message for BellaES">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" placeholder="Your name" autocomplete="name" required>

            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" placeholder="your@email.com" autocomplete="email" required>

            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" placeholder="Type your message" rows="8" required></textarea>

            <button type="submit">Send Message</button>
            <p class="contact-form-status" aria-live="polite"></p>
          </form>
          <div class="contact-thank-you" aria-live="polite">
            <div class="contact-thank-video-wrap">
              <video class="contact-thank-video" autoplay muted loop playsinline preload="metadata"></video>
            </div>
            <p class="contact-thank-title">Thank you for your message! TALK SOON!</p>
            <button class="contact-another-message" type="button">Another message...?</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/contact.js?v=2"></script>
</body>

</html>
